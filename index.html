<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Talento en Acción</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Concepto: plataforma educativa SaaS. Barra lateral azul noche en escritorio, navegación inferior táctil en tableta/teléfono. Superficies blancas alternadas con bloques de color vibrante. */
:root{
  --blue:#2563EB;--fuchsia:#EC4899;--violet:#8B5CF6;--cyan:#06B6D4;--lime:#A3E635;--orange:#F97316;--navy:#0F172A;
  --bg:#F8FAFC;--surface:#FFFFFF;--surface2:#F1F5F9;--ink:#0F172A;--muted:#475569;--line:#E2E8F0;
  --limeInk:#3F6212;--blueInk:#1D4ED8;--violetInk:#6D28D9;--fuchsiaInk:#BE185D;--orangeInk:#C2410C;--cyanInk:#0E7490;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 28px rgba(15,23,42,.07);
  --fh:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fb:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1120;--surface:#131C31;--surface2:#1B2640;--ink:#F1F5F9;--muted:#A9B6CC;--line:#27334F;
  --limeInk:#BEF264;--blueInk:#93B4FF;--violetInk:#C4B5FD;--fuchsiaInk:#F9A8D4;--orangeInk:#FDBA74;--cyanInk:#67E8F9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1120;--surface:#131C31;--surface2:#1B2640;--ink:#F1F5F9;--muted:#A9B6CC;--line:#27334F;
  --limeInk:#BEF264;--blueInk:#93B4FF;--violetInk:#C4B5FD;--fuchsiaInk:#F9A8D4;--orangeInk:#FDBA74;--cyanInk:#67E8F9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.55;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
textarea,input{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--fh);margin:0;letter-spacing:-.01em;line-height:1.15;text-wrap:balance;color:var(--ink)}
p{margin:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.i{flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* layout */
.app{min-height:100vh}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-left,0px));background:var(--navy);color:#fff}
.top b{font-family:var(--fh);font-size:16px;font-weight:800}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
.main{min-width:0}
.wrap{max-width:1120px;margin:0 auto;padding-block:22px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px));box-shadow:0 -8px 24px rgba(15,23,42,.08)}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:12px;font-size:10.5px;font-weight:600;color:var(--muted);min-height:52px;min-width:0}
.bnav button.on{color:#fff;background:linear-gradient(135deg,var(--blue),var(--violet))}
@media (min-width:900px){
  .top,.bnav,body::before{display:none}
  .side{display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;width:272px;background:linear-gradient(180deg,#0F172A 0%,#16204A 100%);color:#fff;padding:24px 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:20;gap:6px;overflow-y:auto}
  .main{margin-left:272px}
  .wrap{padding-block:34px 60px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px}
.brand b{font-family:var(--fh);font-weight:800;font-size:17px;line-height:1.1;display:block}
.brand small{color:#A9B6CC;font-size:12px}
.navb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;color:#C7D2E6;font-weight:600;min-height:48px;transition:background .2s,color .2s}
.navb:hover{background:rgba(255,255,255,.08);color:#fff}
.navb.on{background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;box-shadow:0 8px 20px rgba(37,99,235,.35)}
.side-foot{margin-top:auto;padding:14px;border-radius:16px;background:rgba(255,255,255,.07);font-size:12.5px;color:#C7D2E6;display:flex;flex-direction:column;gap:8px}
.side-foot .bar{background:rgba(255,255,255,.15)}

/* primitives */
.ico{display:inline-grid;place-items:center;flex:none;width:var(--s,44px);height:var(--s,44px);border-radius:50%;background:var(--c,var(--blue));color:#fff;box-shadow:0 6px 14px color-mix(in srgb,var(--c,var(--blue)) 35%,transparent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.pad{padding:20px}
@media(min-width:700px){.pad{padding:26px}}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--violetInk)}
.h1{font-size:clamp(26px,4.4vw,40px);font-weight:800}
.h2{font-size:clamp(20px,2.6vw,26px);font-weight:800}
.h3{font-size:17px;font-weight:700}
.lead{color:var(--muted);font-size:16px;max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:50px;padding:0 24px;border-radius:999px;font-weight:700;font-size:15px;transition:transform .15s,box-shadow .2s,background .2s;text-align:center}
.btn:active{transform:scale(.97)}
.btn-hot{background:var(--fuchsia);color:#fff;box-shadow:0 10px 24px rgba(236,72,153,.38)}
.btn-hot:hover{background:#DB2777}
.btn-p{background:var(--blue);color:#fff;box-shadow:0 10px 22px rgba(37,99,235,.3)}
.btn-p:hover{background:#1D4ED8}
.btn-ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blueInk)}
.btn-glass{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.35)}
.btn-glass:hover{background:rgba(255,255,255,.2)}
.btn-lime{background:var(--lime);color:var(--navy)}
.btn[disabled],.btn.off{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-sm{min-height:42px;padding:0 18px;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--lime) 30%,transparent);color:var(--limeInk)}
.pill.warn{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orangeInk)}
.pill.cy{background:color-mix(in srgb,var(--cyan) 18%,transparent);color:var(--cyanInk)}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;width:var(--w,0%);border-radius:99px;background:var(--c,linear-gradient(90deg,var(--cyan),var(--blue)));animation:grow .9s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{width:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes ringin{from{stroke-dashoffset:var(--C)}}
.view{display:flex;flex-direction:column;gap:22px;min-width:0}
.view.anim{animation:rise .35s ease both}
.noanim *{animation:none!important}
.ringw{position:relative;flex:none}
.ringw svg{display:block}
.rt{stroke:var(--surface2)}
.rv{stroke-linecap:round;animation:ringin 1s cubic-bezier(.2,.8,.2,1)}
.ringl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--fh);font-weight:800;font-size:22px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:30px;color:#fff;padding:28px 22px 26px;background:
  radial-gradient(600px 340px at 85% 10%,rgba(236,72,153,.55),transparent 60%),
  radial-gradient(520px 380px at 0% 100%,rgba(37,99,235,.7),transparent 60%),
  radial-gradient(500px 300px at 60% 110%,rgba(139,92,246,.6),transparent 60%),#0F172A;
  display:grid;gap:26px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.hero{padding:48px 44px;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:center}}
.hero h1{color:#fff;font-size:clamp(34px,6.6vw,60px);font-weight:800;line-height:1.02}
.hero h1 span{background:linear-gradient(90deg,#67E8F9,#C4B5FD,#F9A8D4);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.sub{color:#D5DEEF;font-size:17px;max-width:46ch}
.hero .tag{display:inline-flex;gap:8px;align-items:center;padding:6px 13px;border-radius:99px;background:rgba(255,255,255,.12);font-size:13px;font-weight:600;width:fit-content}
.art{position:relative;min-height:260px}
.art svg{width:100%;height:auto;display:block}
.fl{position:absolute;display:flex;align-items:center;gap:8px;padding:7px 14px 7px 7px;border-radius:99px;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);font-size:13px;font-weight:700;animation:floaty 5s ease-in-out infinite}
.benefit{display:flex;gap:14px;align-items:center;padding:16px}
.benefit b{font-family:var(--fh);font-size:18px;display:block;line-height:1.2}
.path{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.pstep{display:flex;gap:12px;align-items:flex-start;padding:16px;text-align:left;width:100%;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);transition:transform .15s,border-color .2s}
.pstep:hover{transform:translateY(-2px);border-color:var(--violet)}
.pstep.done{border-color:color-mix(in srgb,var(--lime) 70%,var(--line))}

/* diagnostic */
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:22px;height:8px;border-radius:99px;background:var(--surface2)}
.dots i.d{background:var(--lime)}
.dots i.c{background:var(--violet);width:34px}
.stmt{padding:18px;border-radius:18px;background:var(--surface2);display:flex;flex-direction:column;gap:14px}
.stmt p.q{font-weight:600;font-size:16.5px;line-height:1.4}
.opts{display:grid;gap:8px;grid-template-columns:1fr}
.opt{display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);text-align:left;font-weight:600;transition:all .15s}
.opt:hover{border-color:var(--violet)}
.opt .n{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--surface2);font-family:var(--fh);font-weight:800;font-size:14px;flex:none}
.opt.sel{background:var(--violet);color:#fff;border-color:var(--violet);transform:scale(1.01);box-shadow:0 8px 18px rgba(139,92,246,.35)}
.opt.sel .n{background:#fff;color:var(--violetInk)}
@media(min-width:700px){.opts{grid-template-columns:repeat(5,1fr)}.opt{flex-direction:column;justify-content:center;text-align:center;padding:12px 6px;font-size:13px;gap:6px}}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--cyan) 12%,transparent);color:var(--ink);font-size:13.5px}
.note .i{color:var(--cyanInk);margin-top:2px}
.err{padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--orange) 15%,transparent);color:var(--orangeInk);font-weight:600;font-size:14px}
.err ul{margin:6px 0 0;padding-left:18px;font-weight:500}

/* results */
.banner{border-radius:28px;color:#fff;padding:26px 22px;background:linear-gradient(120deg,var(--blue),var(--violet) 55%,var(--fuchsia));display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner h1{color:#fff}
.banner .eyebrow{color:#E9D5FF}
.chartbox{width:100%;max-width:560px;margin:0 auto}
.chartbox svg{width:100%;height:auto;display:block}
.chartbox text{font-family:var(--fb);fill:var(--muted)}
.lgd{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));font-size:13px}
.lgd div{display:flex;align-items:center;gap:8px;min-width:0}
.lgd .nn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;flex:none;background:var(--c)}
.brow{display:grid;grid-template-columns:36px minmax(0,1fr) 52px;gap:10px;align-items:center}
.brow .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .vv{font-weight:800;font-family:var(--fh);text-align:right}
.scard{padding:18px;display:flex;flex-direction:column;gap:12px;border-radius:20px;border:1px solid var(--line);background:var(--surface);position:relative;overflow:hidden}
.scard::after{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.score{font-family:var(--fh);font-weight:800;font-size:28px}

/* dimensions */
.dcard{display:flex;flex-direction:column;gap:12px;text-align:left;padding:18px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .18s,box-shadow .2s;width:100%;min-width:0}
.dcard:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(15,23,42,.14)}
.dhead{border-radius:28px;color:#fff;padding:24px 22px;background:var(--c);background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#0F172A));display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dhead h1{color:#fff}
.dhead .ico{background:rgba(255,255,255,.22);box-shadow:none}
.sec{display:flex;flex-direction:column;gap:10px}
.sec .lab{display:flex;gap:10px;align-items:center}
.ta{width:100%;min-height:96px;resize:vertical;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);line-height:1.5}
.ta:focus{border-color:var(--c,var(--blue));outline:3px solid color-mix(in srgb,var(--c,var(--blue)) 25%,transparent)}
.tin{width:100%;min-height:48px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.callout{padding:16px 18px;border-radius:18px;background:color-mix(in srgb,var(--c,var(--blue)) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--c,var(--blue)) 28%,var(--line))}
.chk{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;border:2px solid var(--line);background:var(--surface);flex:none;color:transparent;transition:all .15s}
.chk[aria-checked="true"]{background:var(--lime);border-color:var(--lime);color:var(--navy)}
.chkrow{display:flex;gap:12px;align-items:center;min-height:48px;text-align:left;width:100%}

/* plan */
.week{border-radius:24px;overflow:hidden;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.whead{display:flex;gap:14px;align-items:center;padding:18px 20px;color:#fff;background:var(--c)}
.whead h3{color:#fff}
.whead .ico{background:rgba(255,255,255,.22);box-shadow:none}
.task{padding:14px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--blueInk);list-style:none;display:inline-flex;align-items:center;gap:6px;min-height:34px}
.task summary::-webkit-details-marker{display:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{aspect-ratio:1/1;border-radius:12px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);position:relative;min-width:0}
.cell small{font-size:9.5px;font-weight:500;opacity:.8}
.cell.t{background:color-mix(in srgb,var(--blue) 14%,var(--surface2));color:var(--blueInk)}
.cell.p{background:color-mix(in srgb,var(--orange) 24%,var(--surface2));color:var(--orangeInk)}
.cell.k{background:var(--lime);color:var(--navy)}
.cell.now{outline:3px solid var(--fuchsia);outline-offset:1px}
.cell.hd{aspect-ratio:auto;background:none;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 0}
.cell.a1{background:color-mix(in srgb,var(--cyan) 30%,var(--surface2));color:var(--ink)}
.cell.a2{background:color-mix(in srgb,var(--blue) 55%,var(--surface2));color:#fff}
.cell.a3{background:var(--violet);color:#fff}
.cell.e{background:none}

/* progress */
.tile{padding:20px;display:flex;flex-direction:column;gap:6px}
.big{font-family:var(--fh);font-weight:800;font-size:40px;line-height:1}
.cols{display:flex;align-items:flex-end;gap:5px;height:150px;border-bottom:2px solid var(--line);padding-bottom:0}
.cols>div{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:11px;color:var(--muted)}
.cols i{display:block;width:100%;max-width:26px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--violet),var(--blue));height:var(--h);animation:colin .8s cubic-bezier(.2,.8,.2,1);min-height:3px}
.cols i.z{background:var(--surface2)}
@keyframes colin{from{height:0}}
.dl{display:flex;gap:5px;margin-top:6px;font-size:11px;color:var(--muted)}
.dl span{flex:1;text-align:center;min-width:0}
.ach{display:flex;gap:14px;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--surface);align-items:flex-start}
.ach.lock{opacity:.92}
.ach.lock .ico{background:var(--surface2);color:var(--muted);box-shadow:none}
.ach.un{border-color:color-mix(in srgb,var(--lime) 70%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--lime) 14%,var(--surface)),var(--surface))}
.hist{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}

/* journal */
.entry{padding:18px;border-radius:20px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:10px}
.qa b{display:block;font-size:12.5px;color:var(--violetInk);margin-bottom:2px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:44px 22px;border-radius:26px;border:2px dashed var(--line);background:var(--surface)}
.empty p{max-width:44ch;color:var(--muted)}

/* overlay */
.toasts{position:fixed;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none;padding:0 16px}
@media(min-width:900px){.toasts{bottom:28px;left:272px}}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;max-width:440px;padding:11px 18px 11px 11px;border-radius:99px;background:var(--navy);color:#fff;box-shadow:0 14px 34px rgba(15,23,42,.35);font-weight:600;font-size:14px;animation:rise .3s ease both}
.toast.ach{background:linear-gradient(120deg,var(--blue),var(--violet),var(--fuchsia))}

}

/* ============ VISTA: RESULTADOS ============ */
function radar(sc){
  const cx=260,cy=250,R=160,N=13;
  const P=(i,v,rr)=>{const a=(-90+i*360/N)*Math.PI/180,r=(rr||R)*v/5;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  const rings=[1,2,3,4,5].map(l=>`<polygon points="${DIMS.map((_,i)=>P(i,l).map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="${l===5?1.6:1}"/>`).join('');
  const axes=DIMS.map((_,i)=>{const p=P(i,5);return `<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="var(--line)"/>`}).join('');
  const pts=sc.map((x,i)=>P(i,x.avg).map(n=>n.toFixed(1)).join(',')).join(' ');
  const dots=sc.map((x,i)=>{const p=P(i,x.avg),d=DIM(x.id);return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="6" fill="${d.color}" stroke="#fff" stroke-width="2"><title>${esc(d.name)}: ${round1(x.avg)} de 5</title></circle>`}).join('');
  const labs=sc.map((x,i)=>{const p=P(i,5,R+27),d=DIM(x.id);return `<g><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="12" fill="${d.color}"/><text x="${p[0].toFixed(1)}" y="${(p[1]+4).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="800" style="fill:#fff">${d.id}</text></g>`}).join('');
  const lv=[1,2,3,4,5].map(l=>`<text x="${cx+5}" y="${cy-R*l/5-3}" font-size="10">${l}</text>`).join('');
  return `<div class="chartbox"><svg viewBox="0 0 520 500" role="img" aria-label="Gráfico radar de las 13 dimensiones">${rings}${axes}${lv}<polygon points="${pts}" fill="rgba(139,92,246,.28)" stroke="#8B5CF6" stroke-width="3" stroke-linejoin="round"/>${dots}${labs}</svg></div>`;
}
function interp(rk){
  const avg=rk.sc.reduce((a,b)=>a+b.avg,0)/13;
  const nm=a=>list(a.map(x=>DIM(x.id).name.toLowerCase()));
  let base;
  if(avg<2.5)base='Tu autoevaluación muestra varias áreas con mucho espacio para crecer. Eso es un excelente punto de partida, porque te permite elegir con claridad dónde empezar.';
  else if(avg<3.5)base='Tu autoevaluación combina áreas que valoras de forma sólida con otras que están en desarrollo, un equilibrio que facilita elegir acciones concretas.';
  else if(avg<4.3)base='Tu autoevaluación refleja una base sólida en la mayoría de las dimensiones y algunas oportunidades claras para seguir avanzando.';
  else base='Valoras de forma muy positiva casi todas las dimensiones. El reto ahora es mantener una mirada curiosa y contrastar tu percepción con la de otras personas.';
  return `${base} Hoy valoras de forma más positiva ${nm(rk.top)}. La oportunidad más interesante para convertir ideas en acciones concretas está en ${nm(rk.low)}.`;
}

/* ============ PLAN DE 30 DÍAS ============ */
function createPlan(){
  const rk=ranked(),low=rk.low.map(x=>x.id),tasks=[];
  WEEKS.forEach(w=>{
    low.forEach((id,i)=>{const p=DIM(id).plan[w.n-1];tasks.push({w:w.n,day:(w.n-1)*7+1+i*2,dim:id,title:p[0],desc:p[1],done:false,note:'',dd:null})});
    tasks.push({w:w.n,day:w.n*7,dim:null,title:'Reflexión de la semana '+w.n,desc:w.ref+' Escribe tus conclusiones en la nota.',done:false,note:'',dd:null});
  });
  tasks.push({w:4,day:30,dim:null,title:'Carta a mi yo futuro',desc:'En la nota escribe qué lograste en 30 días, qué hábito mantendrás y cuál es tu próximo objetivo.',done:false,note:'',dd:null});
  S.plan={start:today(),focus:low,tasks};ui.open={};
  S.view='plan';commit('Generó su plan de 30 días');toast('Tu plan de 30 días está listo');render({anim:true,top:true});
}
function planDay(){return Math.round((parseD(today())-parseD(S.plan.start))/864e5)+1}

  if(!S.plan){const low=ranked().low;return `<div><span class="eyebrow">Mi plan</span><h1 class="h1" style="margin-top:6px">MI TRANSFORMACIÓN EN 30 DÍAS</h1></div>

  P.tasks.forEach((t,i)=>{(byDay[t.day]=byDay[t.day]||[]).push(t)});
  const cal=Array.from({length:30},(_,k)=>{const n=k+1,ts=byDay[n]||[];let c='';

  return `<section class="banner" style="background:linear-gradient(120deg,var(--cyan),var(--blue) 50%,var(--violet))"><div class="col" style="gap:8px;flex:1;min-width:240px"><span class="eyebrow">Inicio: ${fmt(P.start,{day:'numeric',month:'long'})} · ${dayN>30?'Plan finalizado en el calendario':'Día '+Math.max(dayN,1)+' de 30'}</span><h1 class="h1">MI TRANSFORMACIÓN EN 30 DÍAS</h1><div class="row">${P.focus.map(id=>{const d=DIM(id);return `<span class="pill" style="background:rgba(255,255,255,.2);color:#fff">${d.name}</span>`}).join('')}</div></div>

<section class="card pad col"><div class="row">${chip('calendar-days','#2563EB',40)}<div><h3 class="h3">Calendario del plan</h3><p class="muted small">Verde: completo · Naranja: pendiente atrasado · Azul: con tareas</p></div></div><div class="cal">${cal}</div></section>
${WEEKS.map(w=>{const ts=P.tasks.map((t,i)=>({t,i})).filter(x=>x.t.w===w.n),dn=ts.filter(x=>x.t.done).length;
  return `<section class="week"><div class="whead" style="--c:${w.color}">${chip(w.icon,w.color,48)}<div style="flex:1;min-width:0"><h3 class="h3">Semana ${w.n} — ${w.name}</h3><span class="small" style="opacity:.92">${w.sub} · ${ranges[w.n-1]}</span></div><b style="font-family:var(--fh)">${dn}/${ts.length}</b></div>
  ${ts.map(({t,i})=>{const d=t.dim?DIM(t.dim):null;
    return `<div class="task ${t.done?'done':''}"><button class="chkrow" role="checkbox" aria-checked="${t.done}" data-act="task" data-i="${i}"><span class="chk" aria-checked="${t.done}">${ic('check',20,3)}</span><span class="col" style="gap:3px;flex:1"><span class="tt" style="font-weight:700">${esc(t.title)}</span><span class="small muted" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${ic('clock',13)} ${fmt(addDays(P.start,t.day-1),{weekday:'short',day:'numeric',month:'short'})}${d?` · <span style="color:${d.color};font-weight:700">${d.name}</span>`:' · Reflexión'}${t.done?` · hecha el ${fmt(t.dd)}`:''}</span></span></button>
    <p class="small muted" style="padding-left:44px">${esc(t.desc)}</p>
    <details class="task-d" data-ti="${i}" ${ui.open[i]||t.note?'open':''} style="padding-left:44px"><summary>${ic('pencil',14)} Nota de reflexión</summary><textarea class="ta" id="tn-${i}" data-f="tn:${i}" aria-label="Nota de ${esc(t.title)}" placeholder="¿Qué observaste, qué aprendiste?" style="--c:${w.color};min-height:84px;margin-top:6px">${esc(t.note)}</textarea></details></div>`}).join('')}</section>`}).join('')}
<div><button class="btn btn-ghost btn-sm" data-act="plan-create">${ic('refresh',16)} Generar un plan nuevo</button></div>`;
}

/* ============ PROGRESO ============ */
function vProgress(){
  const s=stats(),now=new Date(),k14=Array.from({length:14},(_,i)=>addDays(today(),i-13)),mx=Math.max(1,...k14.map(k=>S.act[k]||0));
  const y=now.getFullYear(),m=now.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate();
  let cells='';['L','M','X','J','V','S','D'].forEach(x=>cells+=`<div class="cell hd">${x}</div>`);
  for(let i=0;i<first;i++)cells+='<div class="cell e"></div>';
  for(let d=1;d<=dim;d++){const key=`${y}-${pad2(m+1)}-${pad2(d)}`,n=S.act[key]||0;cells+=`<div class="cell ${n?(n>=4?'a3':n>=2?'a2':'a1'):''} ${key===today()?'now':''}" title="${n} acciones registradas" style="aspect-ratio:1.3/1"><span>${d}</span></div>`}
  const hist=[];
  S.journal.forEach(e=>{const t=e.a.find(x=>x.trim());hist.push({ts:e.ts,icon:'notebook-pen',color:'#0D9488',title:'Diario · '+fmt(e.date),txt:t||''})});
  DIMS.forEach(d=>{const st=D(d.id);if(st.done)hist.push({ts:st.ts||0,icon:d.icon,color:d.color,title:'Dimensión completada · '+d.name,txt:st.r[0]})});
  hist.sort((a,b)=>b.ts-a.ts);
  const last=S.last?`${esc(S.last.t)} · ${new Date(S.last.ts).toLocaleDateString('es',{day:'numeric',month:'long'})}`:null;
  const planNote=S.plan?'':' El plan aún no está generado.';
  return `<div><span class="eyebrow">Mi progreso</span><h1 class="h1" style="margin-top:6px">ASÍ ESTÁS TRANSFORMANDO TU TALENTO</h1><p class="lead" style="margin-top:8px">Todas las cifras salen de lo que has hecho en esta aplicación.${planNote}</p></div>
<section class="grid g4">
  <div class="card tile"><div class="row between">${ring(s.pct,'#8B5CF6',96,s.pct+'%','Actividades completadas')}${chip('circle-check','#8B5CF6',40)}</div><b>Actividades completadas</b><span class="muted small">${s.done} de ${s.total} (diagnóstico, dimensiones y plan)</span></div>
  <div class="card tile"><div class="row between"><span class="big">${s.ret}</span>${chip('target','#F97316',40)}</div><b>Retos realizados</b><span class="muted small">de 13 retos de dimensiones</span></div>
  <div class="card tile"><div class="row between"><span class="big">${s.vis}</span>${chip('compass','#06B6D4',40)}</div><b>Dimensiones exploradas</b><span class="muted small">${s.dd} completadas de 13</span></div>
  <div class="card tile"><div class="row between">${ring(s.planPct,'#06B6D4',96,s.pt?s.planPct+'%':'—','Plan de 30 días')}${chip('calendar-days','#06B6D4',40)}</div><b>Plan de 30 días</b><span class="muted small">${s.pt?s.pd+' de '+s.pt+' actividades':'Aún sin plan'}</span></div>
</section>
<section class="card pad row">${chip('activity','#2563EB',44)}<div><b>Última actividad registrada</b><p class="muted small">${last||'Todavía no hay actividad registrada.'}</p></div></section>
<section class="grid g2">
  <div class="card pad col"><div class="row">${chip('bar-chart','#8B5CF6',40)}<div><h3 class="h3">Actividad de los últimos 14 días</h3><p class="muted small">Acciones registradas por día</p></div></div>
    <div class="cols" role="img" aria-label="Columnas de actividad diaria">${k14.map(k=>{const n=S.act[k]||0;return `<div title="${n} acciones el ${fmt(k)}">${n?`<span>${n}</span>`:''}<i class="${n?'':'z'}" style="--h:${n?Math.max(8,Math.round(n/mx*100)):3}%"></i></div>`}).join('')}</div>
    <div class="dl">${k14.map(k=>`<span>${parseD(k).getDate()}</span>`).join('')}</div></div>
  <div class="card pad col"><div class="row">${chip('calendar-days','#2563EB',40)}<div><h3 class="h3">${now.toLocaleDateString('es',{month:'long',year:'numeric'})}</h3><p class="muted small">${s.days} días con actividad en total</p></div></div><div class="cal">${cells}</div></div>
</section>
<section class="col"><div class="row">${chip('trophy','#D97706',40)}<div><h2 class="h2">Tus logros</h2><p class="muted small">${Object.keys(S.ach).length} de ${ACH.length} desbloqueados</p></div></div>
<div class="grid g2">${ACH.map(a=>{const un=S.ach[a.id],p=a.prog(s);return `<div class="ach ${un?'un':'lock'}">${chip(un?a.icon:'lock',a.color,52)}<div class="col" style="gap:4px;flex:1"><div class="row between"><b style="font-family:var(--fh)">${a.name}</b>${un?`<span class="pill ok">${fmt(un,{day:'numeric',month:'short'})}</span>`:`<span class="pill">Bloqueado</span>`}</div><span class="muted small">${a.desc}</span>${un?'':`<div class="row" style="gap:10px;flex-wrap:nowrap">${bar(Math.round(p[0]/p[1]*100),a.color)}<span class="small muted" style="white-space:nowrap">${p[0]}/${p[1]}</span></div>`}</div></div>`}).join('')}</div></section>
<section class="card pad col"><div class="row">${chip('notebook-pen','#0D9488',40)}<h3 class="h3">Historial de reflexiones</h3></div>
${hist.length?hist.slice(0,6).map(h=>`<div class="hist">${chip(h.icon,h.color,36)}<div class="col" style="gap:2px;min-width:0"><b class="small">${esc(h.title)}</b><span class="muted small" style="overflow-wrap:anywhere">${esc(h.txt.length>140?h.txt.slice(0,140)+'…':h.txt)}</span></div></div>`).join(''):'<p class="muted">Aún no hay reflexiones. Escribe en tu diario o completa una dimensión para verlas aquí.</p>'}
${hist.length?`<div><button class="btn btn-ghost btn-sm" data-act="go" data-v="journal">Abrir mi diario</button></div>`:''}</section>`;
}

/* ============ DIARIO ============ */
function vJournal(){
  const dr=S.jdraft,ents=[...S.journal].sort((a,b)=>b.ts-a.ts);
  const editor=ui.jedit?`<section class="card pad col" style="gap:16px"><div class="row between"><div class="row">${chip('pencil','#0D9488',44)}<div><h2 class="h2">${dr.id?'Editar entrada':'Nueva entrada'}</h2><p class="muted small">${dr.id?'Escrita el '+fmtLong(S.journal.find(e=>e.id===dr.id)?.date||today()):fmtLong(today())}</p></div></div></div>
  ${JQ.map((q,k)=>`<div class="sec"><label class="lab" for="j-${k}">${chip(q[0],'#0D9488',30)}<b>${q[1]}</b></label><textarea class="ta" id="j-${k}" data-f="j:${k}" placeholder="Escribe aquí…" style="--c:#0D9488;min-height:80px">${esc(dr.a[k])}</textarea></div>`).join('')}
  ${ui.jerr?'<div class="err" role="alert">Escribe al menos una respuesta de 3 caracteres o más para guardar la entrada.</div>':''}
  <div class="row"><button class="btn btn-p" data-act="j-save">${ic('check',18)} Guardar entrada</button><button class="btn btn-ghost" data-act="j-cancel">Cancelar</button></div></section>`:'';
  return `<div class="row between"><div><span class="eyebrow">Mi diario</span><h1 class="h1" style="margin-top:6px">MI DIARIO DE EVOLUCIÓN</h1><p class="lead" style="margin-top:8px">Un espacio breve para registrar lo que descubres y decides.</p></div>${ui.jedit?'':`<button class="btn btn-hot" data-act="j-new">${ic('plus',18)} Nueva entrada</button>`}</div>
${editor}
${ents.length?`<section class="col">${ents.map(e=>`<article class="entry"><div class="row between"><div class="row">${chip('notebook-pen','#0D9488',36)}<div><b style="font-family:var(--fh)">${fmt(e.date,{weekday:'long',day:'numeric',month:'long'})}</b>${e.edited?'<span class="muted small"> · editada</span>':''}</div></div>
<div class="row"><button class="btn btn-ghost btn-sm" data-act="j-edit" data-id="${e.id}" aria-label="Editar entrada">${ic('pencil',15)} Editar</button><button class="btn btn-ghost btn-sm" data-act="j-del" data-id="${e.id}" aria-label="Eliminar entrada">${ic('trash',15)}</button></div></div>
${JQ.map((q,k)=>e.a[k]&&e.a[k].trim()?`<div class="qa"><b>${q[1]}</b><p style="overflow-wrap:anywhere;white-space:pre-wrap">${esc(e.a[k])}</p></div>`:'').join('')}</article>`).join('')}</section>`
:(ui.jedit?'':empty('notebook-pen','#0D9488','Tu diario está vacío','Escribe tu primera entrada con cinco preguntas breves. Cada una queda guardada con su fecha para que puedas volver a ellas.',`<button class="btn btn-hot" data-act="j-new">${ic('plus',18)} Escribir mi primera entrada</button>`))}`;
}

/* ============ SHELL, RENDER Y EVENTOS ============ */
function activeNav(){return S.view==='dim'?'dims':S.view}
function shell(content){
  const s=stats();
  const nav=NAV.map(n=>`<button class="navb ${activeNav()===n[0]?'on':''}" data-act="go" data-v="${n[0]}" ${activeNav()===n[0]?'aria-current="page"':''}>${ic(n[3],22)}<span>${n[1]}</span></button>`).join('');
  const bn=NAV.map(n=>`<button class="${activeNav()===n[0]?'on':''}" data-act="go" data-v="${n[0]}" aria-label="${n[1]}" ${activeNav()===n[0]?'aria-current="page"':''}>${ic(n[3],22)}<span>${n[2]}</span></button>`).join('');
  const modal=ui.modal?`<div class="modalbg" data-act="modal-bg"><div class="card modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="row">${chip('info','#F97316',42)}<h3 class="h3" id="mt">${ui.modal.t}</h3></div><p class="muted">${ui.modal.p}</p><div class="row" style="justify-content:flex-end"><button class="btn btn-ghost btn-sm" data-act="modal-cancel">Cancelar</button><button class="btn btn-hot btn-sm" data-act="modal-ok">${ui.modal.ok}</button></div></div></div>`:'';
  return `<div class="app"><aside class="side"><div class="brand">${chip('sparkles','#8B5CF6',44)}<div><b>TALENTO EN ACCIÓN</b><small>Convierte tu potencial en resultados</small></div></div>${nav}
<div class="side-foot"><div class="row between"><b>Tu avance</b><b>${s.pct}%</b></div>${bar(s.pct,'linear-gradient(90deg,var(--cyan),var(--lime))')}<span>${s.done} de ${s.total} actividades</span></div></aside>
<header class="top">${chip('sparkles','#8B5CF6',32)}<b>Talento en Acción</b></header>
<main class="main"><div class="wrap"><div class="view" id="view">${content}</div></div></main>
<nav class="bnav" aria-label="Navegación principal">${bn}</nav></div>${modal}`;
}
function body(){
  switch(S.view){case'diag':return vDiag();case'results':return vResults();case'dims':return vDims();case'dim':return S.dimId?vDim(S.dimId):vDims();case'plan':return vPlan();case'progress':return vProgress();case'journal':return vJournal();default:return vHome()}
}
function render(o){
  o=o||{};const y=window.scrollY,app=document.getElementById('app');
  try{app.innerHTML=shell(body())}
  catch(err){console.error(err);app.innerHTML=`<div style="padding:24px;max-width:520px;margin:40px auto"><div class="card pad col"><h2 class="h2">Algo no salió como esperábamos</h2><p class="muted">Tus datos siguen guardados. Vuelve al inicio e inténtalo de nuevo.</p><button class="btn btn-p" data-act="go" data-v="home">Volver al inicio</button></div></div>`}
  app.classList.toggle('noanim',!o.anim);
  const v=document.getElementById('view');if(v&&o.anim)v.classList.add('anim');
  window.scrollTo(0,o.top?0:y);
}
function nav(v){S.view=v;ui.err=null;ui.jerr=false;save();render({anim:true,top:true})}
function openModal(t,p,ok,act,data){ui.modal={t,p,ok,act,data};render({})}
function closeModal(){ui.modal=null;render({})}
function finishDiag(){
  if(!DIMS.every(d=>ansv(d,0)!=null&&ansv(d,1)!=null)){toast('Faltan respuestas por completar');return}
  S.diag.done=true;S.diag.date=today();S.view='results';commit('Completó el diagnóstico');toast('Tu mapa personal está listo');render({anim:true,top:true});
}
function act(a,el){
  const ds=el.dataset;
  switch(a){
    case'go':return nav(ds.v);
    case'dim-open':{const id=+ds.id;S.dimId=id;S.view='dim';D(id).vis=true;ui.err=null;commit();return render({anim:true,top:true})}
    case'ans':S.diag.a[ds.k]=+ds.v;save();return render({});
    case'diag-prev':if(S.diag.step>0){S.diag.step--;save();render({anim:true,top:true})}return;
    case'diag-next':{const d=DIMS[S.diag.step];if(ansv(d,0)==null||ansv(d,1)==null){toast('Responde las dos afirmaciones para continuar');return}
      if(S.diag.step<12){S.diag.step++;commit('Diagnóstico: etapa '+S.diag.step+' de 13');render({anim:true,top:true})}else finishDiag();return}
    case'retake-ask':return openModal('¿Repetir la evaluación?','Se borrarán tus 26 respuestas actuales y tu mapa. Tu plan, tus ejercicios y tu diario se conservan.','Sí, repetir','retake');
    case'reset-ask':return openModal('¿Borrar todos tus datos?','Se eliminarán diagnóstico, ejercicios, plan, diario y logros guardados en este navegador. No se puede deshacer.','Borrar todo','reset');
    case'plan-create':{if(S.plan&&S.plan.tasks.some(t=>t.done||t.note))return openModal('¿Generar un plan nuevo?','El plan actual, con sus avances y notas, será reemplazado por uno nuevo basado en tu diagnóstico.','Sí, generar nuevo','plan');
      if(!S.diag.done){toast('Primero completa el diagnóstico');return}return createPlan()}
    case'task':{const t=S.plan.tasks[+ds.i];t.done=!t.done;t.dd=t.done?today():null;if(t.done)commit('Plan: '+t.title);else save();return render({})}
    case'ret-toggle':{const s=D(+ds.id);s.ret=!s.ret;if(s.ret)logAct('Reto realizado: '+DIM(+ds.id).name);checkAch();save();return render({})}
    case'dim-done':{const id=+ds.id,s=D(id),d=DIM(id);
      if(s.done){s.done=false;s.date=null;save();return render({})}
      const errs=[];s.r.forEach((t,k)=>{if(t.trim().length<10)errs.push(`Reflexión ${k+1}: escribe al menos 10 caracteres.`)});
      if(s.ex.trim().length<10)errs.push('Ejercicio de aplicación: escribe al menos 10 caracteres.');
      if(!s.ret)errs.push('Marca “Realicé este reto” cuando lo hayas hecho.');
      if(s.rn.trim().length<3)errs.push('Anota cómo mediste el resultado del reto.');
      if(errs.length){ui.err={id,list:errs};render({});const e=document.getElementById('derr');if(e)e.scrollIntoView({behavior:'smooth',block:'center'});return}
      ui.err=null;s.done=true;s.date=today();s.ts=Date.now();commit('Completó la dimensión '+d.name);toast('Dimensión completada: '+d.name,'ach','badge-check');return render({})}
    case'j-new':S.jdraft={id:null,a:['','','','','']};ui.jedit=true;ui.jerr=false;save();render({});return setTimeout(()=>{const e=document.getElementById('j-0');if(e)e.focus()},50);
    case'j-edit':{const e=S.journal.find(x=>x.id===+ds.id);if(!e)return;S.jdraft={id:e.id,a:[...e.a]};ui.jedit=true;ui.jerr=false;save();render({top:true});return}
    case'j-cancel':S.jdraft={id:null,a:['','','','','']};ui.jedit=false;ui.jerr=false;save();return render({});
    case'j-save':{const dr=S.jdraft;if(!dr.a.some(t=>t.trim().length>=3)){ui.jerr=true;return render({})}
      const a=dr.a.map(t=>t.trim());
      if(dr.id){const e=S.journal.find(x=>x.id===dr.id);if(e){e.a=a;e.edited=Date.now()}}else S.journal.push({id:Date.now(),ts:Date.now(),date:today(),a});
      S.jdraft={id:null,a:['','','','','']};ui.jedit=false;ui.jerr=false;commit('Escribió en su diario');toast('Entrada guardada');return render({top:true})}
    case'j-del':return openModal('¿Eliminar esta entrada?','La entrada se borrará de tu diario de forma definitiva.','Eliminar','jdel',+ds.id);
    case'modal-cancel':return closeModal();
    case'modal-bg':if(el===event.target)closeModal();return;
    case'modal-ok':{const m=ui.modal;ui.modal=null;
      if(m.act==='retake'){S.diag={a:{},step:0,done:false,date:null};S.view='diag';save();render({anim:true,top:true})}
      else if(m.act==='reset'){try{localStorage.removeItem(KEY)}catch(e){}mem=null;S=DEF();ui.open={};ui.jedit=false;render({anim:true,top:true});toast('Tus datos fueron borrados')}
      else if(m.act==='plan'){createPlan()}
      else if(m.act==='jdel'){S.journal=S.journal.filter(e=>e.id!==m.data);save();render({});toast('Entrada eliminada')}
      return}
  }
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;try{act(el.dataset.act,el)}catch(err){console.error(err);toast('Ocurrió un error. Intenta de nuevo.')}});
document.addEventListener('input',e=>{
  const t=e.target,f=t.dataset&&t.dataset.f;if(!f)return;const p=f.split(':');
  try{
    if(p[0]==='r'){D(+p[1]).r[+p[2]]=t.value;updDim(+p[1])}
    else if(p[0]==='ex'){D(+p[1]).ex=t.value;updDim(+p[1])}
    else if(p[0]==='rn'){D(+p[1]).rn=t.value;updDim(+p[1])}
    else if(p[0]==='tn'){S.plan.tasks[+p[1]].note=t.value}
    else if(p[0]==='j'){S.jdraft.a[+p[1]]=t.value}
    save();
  }catch(err){console.error(err)}
});
document.addEventListener('toggle',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.ti!==undefined)ui.open[t.dataset.ti]=t.open},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal)closeModal()});

/* ============ ARRANQUE ============ */
(function(){
  const t=document.createElement('div');t.id='toasts';t.className='toasts';t.setAttribute('role','status');t.setAttribute('aria-live','polite');document.body.appendChild(t);
  load();
  ui.jedit=S.jdraft.a.some(x=>x&&x.trim());
  if(!NAV.some(n=>n[0]===S.view)&&S.view!=='dim')S.view='home';
  if(S.view==='dim'&&!DIM(S.dimId))S.view='dims';
  if(S.view==='plan'&&!S.diag.done)S.view='home';
  render({anim:true});
})();
</script>

</body>
</html>
